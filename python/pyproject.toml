[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openses"
version = "0.1.0"
description = "Input/output tools for the OpenSES subway environment simulation"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]

[project.scripts]
openses = "openses.cli:main"

[tool.setuptools]
packages = ["openses"]
